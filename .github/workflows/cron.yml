name: Scheduled jobs

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Release expired seat holds (every run) and top up trips (once a day)
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          DAILY: ${{ github.event.schedule == '15 2 * * *' }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then echo "API_URL / INTERNAL_CRON_SECRET not set, skipping"; exit 0; fi
          full=0; [ "$DAILY" = "true" ] && full=1
          curl -fsS -X POST -H "x-cron-secret: $CRON_SECRET" "$API_URL/api/internal/tick?full=$full"
