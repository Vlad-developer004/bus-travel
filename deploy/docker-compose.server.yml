services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bustravel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bustravel
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bustravel -d bustravel']
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    image: ${IMAGE_PREFIX:?}-api:${TAG:?}
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://bustravel:${POSTGRES_PASSWORD}@db:5432/bustravel
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'

  api:
    image: ${IMAGE_PREFIX:?}-api:${TAG:?}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bustravel:${POSTGRES_PASSWORD}@db:5432/bustravel
      COOKIE_SECURE: 'true'
      APP_VERSION: ${TAG}
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: ${IMAGE_PREFIX:?}-web:${TAG:?}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # TLS certificates live here
    depends_on:
      web: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
